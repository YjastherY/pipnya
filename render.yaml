services:
  - type: web
    name: mayak-yjasthery
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/microblog.sqlite3
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
